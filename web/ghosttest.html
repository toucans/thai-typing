<!doctype html>
<!-- Dev harness: runs just the night hunt, full width, for tuning the scene and
     the difficulty curve. ?n=<night> picks the night; &bot=<cpm> types for you
     (reading the floating labels, so it exercises the real input path) and
     &err=<0..1> gives the bot a wrong-key rate — e.g. ghosttest.html?n=3&bot=120&err=0.1
     — not linked from the app. -->
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>body { margin: 0; background: #777; } main { max-width: none; padding: 8px; }</style>
<script>localStorage.setItem('tt.sound', 'off');</script>
</head>
<body>
<main>
  <div id="gh-setup" hidden>
    <div id="gh-stats"></div>
    <button id="gh-start" hidden></button>
    <div id="gh-nights"></div>
  </div>
  <div id="gh-session">
    <div class="play-head gh-head">
      <span id="gh-title" class="play-title"></span>
      <span id="gh-hud" class="gh-hud"></span>
    </div>
    <div class="mapwrap gh-wrap" id="gh-wrap">
      <canvas id="gh-canvas" width="320" height="180"></canvas>
      <div id="gh-labels"></div>
      <div id="gh-banner" class="gh-banner" hidden></div>
    </div>
    <input id="gh-typebox" type="text" autocomplete="off" spellcheck="false">
    <button class="btn ghost" id="gh-quit">กลับ</button>
  </div>
</main>
<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<canvas id="confetti"></canvas>
<script type="module">
import { initGhosts, startNight } from './js/ghosts.js';
const q = new URLSearchParams(location.search);
initGhosts();
startNight(+(q.get('n') || 1));

const cpm = +q.get('bot');
if (cpm) {
  const box = document.getElementById('gh-typebox');
  const errRate = +(q.get('err') || 0);
  setInterval(() => {
    const lock = document.querySelector('.gh-label.lock');
    let word;
    if (lock && lock.classList.contains('boss')) {
      const cur = [...lock.children].find((s) => !s.className);
      word = cur ? cur.textContent : '';
    } else if (lock) {
      word = lock.textContent;
    } else {
      const any = document.querySelector('.gh-label');
      if (!any) return;
      word = any.textContent;
    }
    let ch = word[box.value.length];
    if (!ch) return;
    if (Math.random() < errRate) ch = ch === 'ก' ? 'ข' : 'ก';
    box.value += ch;
    box.dispatchEvent(new InputEvent('input', { data: ch }));
  }, 60000 / cpm);
}
</script>
</body>
</html>
